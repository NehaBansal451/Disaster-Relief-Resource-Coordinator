services:
  db:
    image: postgis/postgis:16-3.4
    container_name: drrc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-disaster_relief}
      POSTGRES_USER: ${DB_USER:-drrc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: drrc-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-disaster_relief}
      DB_USER: ${DB_USER:-drrc_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_VERSION_HEADER: ${AI_VERSION_HEADER:-}
      AI_VERSION: ${AI_VERSION:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/dockerfile.frontend
    container_name: drrc-frontend
    restart: unless-stopped
    environment:
      DRRC_BACKEND_URL: http://backend:8080
      SERVER_PORT: 8081
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:8081"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  pgdata:
