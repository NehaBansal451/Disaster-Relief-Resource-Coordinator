name: CodeQL

# Static security analysis of the Java code (injection, unsafe deserialization, weak crypto and similar).
# Results appear under the repository's Security -> Code scanning tab.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
