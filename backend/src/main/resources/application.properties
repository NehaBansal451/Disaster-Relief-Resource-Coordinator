spring.application.name=backend
server.port=8080

# Database. Same variable names as deployment/docker/.env.example. DB_PASSWORD has NO default on purpose:
# the app refuses to start without it, so a secret is never hard-coded.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:disaster_relief}
spring.datasource.username=${DB_USER:drrc_user}
spring.datasource.password=${DB_PASSWORD}

# Flyway runs the versioned SQL copied from database/migrations. Hibernate only VALIDATES the schema (never changes it).
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT signing key. NO default on purpose: the app refuses to start without JWT_SECRET (at least 32 characters).
# Generate one with: openssl rand -base64 48
drrc.security.jwt-secret=${JWT_SECRET}
drrc.security.jwt-ttl-seconds=3600

# Health endpoint used by the frontend and by Docker/CI health checks. Status only; no details are exposed.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
